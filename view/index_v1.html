<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>API dos Carros</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-4">

    <h2 class="mb-4"> API dos Carros</h2>

    <!-- FORMULÁRIO -->
    <div class="card mb-4">
        <div class="card-header bg-danger text-white">
            Cadastrar Carro
        </div>
        <div class="card-body">
            <input type="hidden" id="carroId">
            <div class="mb-3">
                <label class="form-label">Nome</label>
                <input type="text" class="form-control" id="nome" placeholder="Ex: Onix Plus">
            </div>
            <div class="mb-3">
                <label class="form-label">Tipo</label>
                <select class="form-select" id="tipo">
                    <option value="">Selecione...</option>
                    <option>classicos</option>
                    <option>luxo</option>
                    <option>esportivos</option>
                    <option>Pickup</option>
                   
                </select>
            </div>
            <button class="btn btn-danger" onclick="salvar()">Salvar</button>
            <button class="btn btn-secondary ms-2" id="btnCancelar" style="display:none" onclick="cancelar()">Cancelar</button>
        </div>
    </div>

    <!-- LISTA DE CARROS -->
    <div class="card">
        <div class="card-header bg-dark text-white">
            Lista de Carros
        </div>
        <div class="card-body p-0">
            <table class="table table-striped mb-0">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Foto</th>
                        <th>Nome</th>
                        <th>Tipo</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="tbody">
                    <tr>
                        <td colspan="5" class="text-center text-muted py-4">Carregando...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>


<!-- MODAL UPLOAD DE FOTO -->
<div class="modal fade" id="modalFoto" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header bg-danger text-white">
                <h5 class="modal-title">Upload de Foto</h5>
                <button class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <p>Carro: <strong id="fotoNomeCarro"></strong></p>
                <input type="hidden" id="fotoCarroId">
                <input type="file" class="form-control" id="inputFoto" accept="image/*">
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button class="btn btn-danger" onclick="enviarFoto()">Enviar Foto</button>
            </div>
        </div>
    </div>
</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>

    // URL da API — conforme o livro do Lecheta
    var url = 'http://localhost:3000/api/carros';

    // ── Ao abrir a página, carrega os carros ──────────────
    // GET /api/carros
    function getCarros() {
        fetch(url)
            .then(function(response) {
                return response.json();
            })
            .then(function(carros) {
                listarCarros(carros);
            })
            .catch(function(error) {
                console.log('Erro: ' + error);
                document.getElementById('tbody').innerHTML =
                    '<tr><td colspan="5" class="text-center text-danger">Erro ao conectar na API.</td></tr>';
            });
    }

    // ── Preenche a tabela com os carros ───────────────────
    function listarCarros(carros) {
        var tbody = document.getElementById('tbody');

        if (carros.length === 0) {
            tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted py-3">Nenhum carro cadastrado.</td></tr>';
            return;
        }

        var html = '';
        for (var i = 0; i < carros.length; i++) {
            var carro = carros[i];

            // Monta a foto — usa o campo url_foto do banco
            var foto = '';
            if (carro.url_foto) {
                foto = '<img src="http://localhost:3000/uploads/' + carro.url_foto + '" '
                     + 'width="50" height="40" style="object-fit:cover;border-radius:4px" '
                     + 'onerror="this.outerHTML=\'\'">';
            } else {
                foto = '🚗';
            }

            html += '<tr>';
            html += '<td>' + carro.id + '</td>';
            html += '<td>' + foto + '</td>';
            html += '<td>' + carro.nome + '</td>';
            html += '<td>' + (carro.tipo || '—') + '</td>';
            html += '<td>';
            html += '<button class="btn btn-sm btn-outline-secondary me-1" onclick="editar(' + carro.id + ',\'' + carro.nome + '\',\'' + carro.tipo + '\')">Editar</button>';
            html += '<button class="btn btn-sm btn-outline-danger me-1" onclick="confirmarDelete(' + carro.id + ',\'' + carro.nome + '\')">Excluir</button>';
            html += '<button class="btn btn-sm btn-outline-dark" onclick="abrirFoto(' + carro.id + ',\'' + carro.nome + '\')">Foto</button>';
            html += '</td>';
            html += '</tr>';
        }

        tbody.innerHTML = html;
    }

    // ── Salvar: POST (novo) ou PUT (editar) ───────────────
    function salvar() {
        var id   = document.getElementById('carroId').value;
        var nome = document.getElementById('nome').value.trim();
        var tipo = document.getElementById('tipo').value;

        if (!nome || !tipo) {
            alert('Preencha o nome e o tipo do carro!');
            return;
        }

        var carro = { nome: nome, tipo: tipo };

        if (id) {
            // PUT /api/carros — atualiza carro existente
            carro.id = parseInt(id);
            fetch(url, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(carro)
            })
            .then(function(res) { return res.json(); })
            .then(function() {
                cancelar();
                getCarros();
            })
            .catch(function(err) { console.log(err); });

        } else {
            // POST /api/carros — cria novo carro
            fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(carro)
            })
            .then(function(res) { return res.json(); })
            .then(function() {
                cancelar();
                getCarros();
            })
            .catch(function(err) { console.log(err); });
        }
    }

    // ── Preenche o formulário para editar ─────────────────
    function editar(id, nome, tipo) {
        document.getElementById('carroId').value = id;
        document.getElementById('nome').value    = nome;
        document.getElementById('tipo').value    = tipo;
        document.getElementById('btnCancelar').style.display = 'inline-block';
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function cancelar() {
        document.getElementById('carroId').value = '';
        document.getElementById('nome').value    = '';
        document.getElementById('tipo').value    = '';
        document.getElementById('btnCancelar').style.display = 'none';
    }

    // ── DELETE /api/carros/:id ────────────────────────────
    function confirmarDelete(id, nome) {
        if (!confirm('Deseja excluir o carro "' + nome + '"?')) return;

        fetch(url + '/' + id, { method: 'DELETE' })
            .then(function() {
                getCarros();
            })
            .catch(function(err) { console.log(err); });
    }

    // ── Abre modal para upload de foto ────────────────────
    function abrirFoto(id, nome) {
        document.getElementById('fotoCarroId').value        = id;
        document.getElementById('fotoNomeCarro').textContent = nome;
        document.getElementById('inputFoto').value          = '';
        bootstrap.Modal.getOrCreateInstance(document.getElementById('modalFoto')).show();
    }

    // ── POST /api/carros/:id/foto ─────────────────────────
    function enviarFoto() {
        var id    = document.getElementById('fotoCarroId').value;
        var input = document.getElementById('inputFoto');

        if (!input.files || !input.files[0]) {
            alert('Selecione uma imagem!');
            return;
        }

        // FormData monta o multipart/form-data para o Multer
        var formData = new FormData();
        formData.append('foto', input.files[0]);

        fetch(url + '/' + id + '/foto', {
            method: 'POST',
        })
        .then(function(res) { return res.json(); })
        .then(function(data) {
            alert(data.msg);
            bootstrap.Modal.getInstance(document.getElementById('modalFoto')).hide();
            getCarros();
        })
        .catch(function(err) { console.log(err); });
    }

    // Carrega os carros ao abrir a página
    getCarros();

</script>
</body>
</html>
