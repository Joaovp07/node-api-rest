<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>API dos Carros</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-4">

    <h2 class="mb-4">API dos Carros</h2>

    <!-- FORMULÁRIO -->
    <div class="card mb-4">
        <div class="card-header bg-danger text-white">
            Cadastrar Carro
        </div>
        <div class="card-body">
            <input type="hidden" id="carroId">
            <div class="mb-3">
                <label class="form-label">Nome</label>
                <input type="text" class="form-control" id="nome" placeholder="Ex: Onix Plus">
            </div>
            <div class="mb-3">
                <label class="form-label">Tipo</label>
                <select class="form-select" id="tipo">
                    <option value="">Selecione...</option>
                    <option>classicos</option>
                    <option>esportivos</option>
                    <option>luxo</option>
                  
                </select>
            </div>
            <button class="btn btn-danger" onclick="salvar()">Salvar</button>
        </div>
    </div>

    <!-- LISTA DE CARROS -->
    <div class="card">
        <div class="card-header bg-dark text-white">
            Lista de Carros
        </div>
        <div class="card-body p-0">
            <table class="table table-striped mb-0">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Nome</th>
                        <th>Tipo</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="tbody">
                    <tr>
                        <td colspan="4" class="text-center text-muted py-4">Carregando...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>

    var url = 'http://localhost:3000/api/carros';

    // ── GET /api/carros ───────────────────────────────────
     function getCarros() {
        fetch(url)
            .then(function(response) {
                return response.json();
            })
            .then(function(carros) {
                listarCarros(carros);
            })
            .catch(function(error) {
                console.log('Erro: ' + error);
                document.getElementById('tbody').innerHTML =
                    '<tr><td colspan="5" class="text-center text-danger">Erro ao conectar na API.</td></tr>';
            });
    }

    // ── Monta a tabela ───────────────────────────────────
    function listarCarros(carros) {
        var tbody = document.getElementById('tbody');
        if (carros.length === 0) {
            tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted py-3">Nenhum carro cadastrado.</td></tr>';
            return;
        }

        var html = '';
        for (var i = 0; i < carros.length; i++) {
            var carro = carros[i];
            html += '<tr>';
            html += '<td>' + carro.id + '</td>';
            html += '<td>' + carro.nome + '</td>';
            html += '<td>' + (carro.tipo || '—') + '</td>';
            html += '<td>';
            html += '  <button class="btn btn-sm btn-outline-secondary me-1" onclick="editar(' + carro.id + ',\'' + escapar(carro.nome) + '\',\'' + (carro.tipo||'') + '\')">Editar</button>';
            html += '</td>';
            html += '</tr>';
        }
        //document.getElementById('tbody').innerHTML = html;
        tbody.innerHTML = html;
    }

    // ── POST ou PUT ───────────────────────────────────────
    function salvar() {
        var id   = document.getElementById('carroId').value;
        var nome = document.getElementById('nome').value.trim();
        var tipo = document.getElementById('tipo').value;

        if (!nome || !tipo) {
            alert('Preencha o nome e o tipo do carro!');
            return;
        }

        var carro = { nome: nome, tipo: tipo };

        if (id) {
            carro.id = parseInt(id);
            fetch(url, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(carro)
            })
            .then(function(res) { return res.json(); })
            .then(function() {
                cancelar();
                getCarros();
            })
                .catch(function(err) { console.log(err); });
        } else {
            // POST /api/carros — cria novo carro
            fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(carro)
            })
            .then(function(res) { return res.json(); })
            .then(function() {
                cancelar();
                getCarros();
            })
                .catch(function(err) { console.log(err); });
        }
    }

    // ── Editar ────────────────────────────────────────────
    function editar(id, nome, tipo) {
        document.getElementById('carroId').value = id;
        document.getElementById('nome').value    = nome;
        document.getElementById('tipo').value    = tipo;
        document.getElementById('btnCancelar').style.display = 'inline-block';
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

  
    // ── DELETE /api/carros/:id ────────────────────────────
    function excluir(id, nome) {
        if (!confirm('Excluir "' + nome + '"?')) return;
        fetch(url + '/' + id, { method:'DELETE' })
            .then(function() { getCarros(); })
            .catch(function(err) { console.log(err); });
    }

    //carrega os carros assim que a página é aberta
getCarros();
</script>
</body>
</html>
